[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "gradientmine"
version = "0.2.0"
description = "Auditable model-improvement bounties with explicitly trusted evaluation"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "fastapi==0.142.2", "uvicorn==0.48.0", "httpx==0.28.1",
  "pydantic==2.13.5", "numpy==2.3.5", "scikit-learn==1.8.0",
  "torch==2.14.1", "cryptography==50.0.2"
]

[project.optional-dependencies]
chain = ["solders==0.29.0"]
llm = ["transformers>=4.57,<6", "peft>=0.18,<1", "safetensors>=0.7,<1", "accelerate>=1.10,<3"]
dev = ["pytest==9.0.3", "playwright==1.57.0", "ruff==0.14.10", "pip-audit==2.10.0", "setuptools==83.0.0", "pip==26.2.1"]

[project.scripts]
gradientmine = "gradientmine.cli:main"

[tool.setuptools.packages.find]
include = ["gradientmine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
