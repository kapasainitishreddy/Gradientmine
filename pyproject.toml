[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gradientmine"
version = "0.2.0"
description = "Auditable model-improvement bounties with explicitly trusted evaluation"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "fastapi==0.128.2", "uvicorn==0.48.0", "httpx==0.28.1",
  "pydantic==2.13.4", "numpy==2.3.5", "scikit-learn==1.8.0",
  "torch==2.10.0", "cryptography==46.0.4"
]

[project.optional-dependencies]
chain = ["solders==0.29.0"]
dev = ["pytest==9.0.2", "playwright==1.57.0", "ruff==0.14.10", "pip-audit==2.10.0"]

[project.scripts]
gradientmine = "gradientmine.cli:main"

[tool.setuptools.packages.find]
include = ["gradientmine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
