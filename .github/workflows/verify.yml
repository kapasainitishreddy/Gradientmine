name: Verify GradientMine
on:
  push:
    branches: [main]
    paths:
      - 'gradientmine/**'
      - 'program/**'
      - 'scripts/**'
      - 'tests/**'
      - 'web/**'
      - 'pyproject.toml'
      - 'package.json'
      - '.github/workflows/verify.yml'
      - 'evidence/RELEASE_GATE.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gradientmine-verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    outputs:
      python_ready: ${{ steps.ready.outputs.python_ready }}
      program_ready: ${{ steps.ready.outputs.program_ready }}
    steps:
      - uses: actions/checkout@v4
      - id: ready
        run: |
          if [ -f tests/test_security.py ] && [ -f gradientmine/chain.py ] && [ -f scripts/publish_demo.py ]; then echo 'python_ready=true' >> "$GITHUB_OUTPUT"; fi
          if [ -f program/src/lib.rs ]; then echo 'program_ready=true' >> "$GITHUB_OUTPUT"; fi
  python:
    needs: source
    if: needs.source.outputs.python_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install CPU training and chain dependencies
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[chain,dev]'
      - name: Test Python, JS and static syntax
        run: |
          set -o pipefail
          mkdir -p ci-evidence
          python -m pytest -q --junitxml=ci-evidence/pytest.xml | tee ci-evidence/pytest.txt
          python -m compileall -q gradientmine scripts
          python -m ruff check gradientmine tests scripts | tee ci-evidence/ruff.txt
          node --test tests/web/*.test.mjs | tee ci-evidence/web-tests.txt
          npm run check | tee ci-evidence/npm-check.txt
      - name: Run actual three-process training exercise
        run: |
          set -o pipefail
          python -m gradientmine.cli demo --out .local/ci-demo | tee ci-evidence/demo.txt
          python -m scripts.publish_demo --run .local/ci-demo/run.json
          cp .local/ci-demo/run.json ci-evidence/run.json
      - name: Install browser and exercise live HTTP UI
        run: |
          python -m playwright install --with-deps chromium
          python -m scripts.browser_qa --out ci-evidence/browser
      - name: Audit dependency advisories
        if: always()
        run: python -m scripts.audit_dependencies --out ci-evidence/dependency-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-verification
          path: |
            ci-evidence/
            web/assets/recorded-run.json
            web/assets/artifacts/
  program:
    needs: source
    if: needs.source.outputs.program_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Compile and test the Rust escrow
        run: |
          set -o pipefail
          mkdir -p ci-evidence
          cargo test --locked --manifest-path program/Cargo.toml 2>&1 | tee ci-evidence/rust-tests.txt
      - name: Install checksum-verified Agave tools
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 -o "$RUNNER_TEMP/agave.tar.bz2" https://github.com/anza-xyz/agave/releases/download/v4.3.0/solana-release-x86_64-unknown-linux-gnu.tar.bz2
          echo 'c97289a8abb1d0efb497d8b5cb285baabd9b7f8ea6647f5d145c5dc8ff3611e8  '"$RUNNER_TEMP/agave.tar.bz2" | sha256sum -c -
          tar -xjf "$RUNNER_TEMP/agave.tar.bz2" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/solana-release/bin" >> "$GITHUB_PATH"
      - name: Build SBF program
        run: |
          set -euo pipefail
          cargo build-sbf --manifest-path program/Cargo.toml --tools-version v1.57 --jobs 2 --sbf-out-dir ci-evidence/sbf -- --locked 2>&1 | tee ci-evidence/sbf-build.txt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exercise compiled SBF in LiteSVM
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip==26.2.1
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[chain,dev]'
          GM_SBF_PATH="$PWD/ci-evidence/sbf/gradientmine_escrow.so" python -m pytest -q tests/test_chain.py tests/test_deployment.py tests/test_devnet_product.py | tee ci-evidence/litesvm-tests.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: escrow-verification
          path: |
            ci-evidence/*.txt
            ci-evidence/sbf/gradientmine_escrow.so
            program/Cargo.lock
