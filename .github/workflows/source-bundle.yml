name: Reproducible source bundle
on:
  push:
    paths: ['.github/workflows/source-bundle.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Archive committed sources and history only
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source-bundle"
          git archive --format=zip HEAD > "$RUNNER_TEMP/source-bundle/GradientMine-source.zip"
          git bundle create "$RUNNER_TEMP/source-bundle/GradientMine.bundle" HEAD refs/remotes/origin/main
          git rev-parse HEAD > "$RUNNER_TEMP/source-bundle/COMMIT.txt"
          cd "$RUNNER_TEMP/source-bundle"
          sha256sum GradientMine-source.zip GradientMine.bundle > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: source-snapshot
          retention-days: 7
          path: ${{ runner.temp }}/source-bundle/
