name: Verification toolchain
on:
  push:
    paths: [.github/workflows/toolchain.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-wheels:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download verification dependencies without user credentials
        run: |
          mkdir -p wheels
          python -m pip download --only-binary=:all: --dest wheels solders==0.29.0 ruff==0.14.10
          cd wheels
          sha256sum *.whl > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: offline-verification-wheels
          path: wheels/
          retention-days: 7
